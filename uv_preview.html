<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Raleway"/>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap" rel="stylesheet"/>
  <title>UV Index – Tempest Today</title>
  <style>
    :root {
      --bg: #ffffff; --text: #111111; --muted: #6b7280;
      --border: #e5e7eb; --card: #ffffff;
      --night: #c5cff0; --night-dim: rgba(197,207,240,0);
    }
    [data-theme="dark"] {
      --bg: #1f2937; --text: #f9fafb; --muted: #9ca3af;
      --border: #374151; --card: #374151;
      --night: #1a2740; --night-dim: rgba(26,39,64,0);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      transition: background 0.3s, color 0.3s; margin: 0;
    }
    .card {
      border: 1px solid var(--border); border-radius: 14px;
      background: var(--card); margin-bottom: 14px; overflow: hidden;
    }
    .lbl {
      font-size: 0.7em; text-transform: uppercase;
      letter-spacing: .08em; color: var(--muted);
    }
    #hillLine {
      stroke-dasharray: 3000;
      stroke-dashoffset: 3000;
      transition: stroke-dashoffset 1.9s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .fzone { opacity: 0; transition: opacity 0.9s ease 0.35s; }

    .chip {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 5px 12px; border-radius: 20px;
      border: 1px solid var(--border);
      font-size: 0.78em; color: var(--muted); margin: 3px 3px 3px 0;
    }
    .toggle-btn { background: none; border: none; cursor: pointer; padding: 0; }
    .toggle-track {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 5px; width: 62px; height: 30px;
      background: var(--card); border: 2px solid var(--border);
      border-radius: 15px; position: relative;
    }
    .toggle-thumb {
      position: absolute; top: 3px; left: 3px; width: 20px; height: 20px;
      border-radius: 50%; background: #87CEEB; transition: transform 0.3s; z-index: 1;
    }
    [data-theme="dark"] .toggle-thumb { transform: translateX(30px); background: linear-gradient(135deg,#667eea,#764ba2); }
    .t-sun, .t-moon { font-size:13px; font-family:'Noto Color Emoji',sans-serif; position:relative; z-index:2; }
    .t-sun { opacity:1; } .t-moon { opacity:0.35; }
    [data-theme="dark"] .t-sun { opacity:0.35; }
    [data-theme="dark"] .t-moon { opacity:1; }
  </style>
</head>
<body>

<header style="border-bottom:1px solid var(--border);margin-bottom:20px;">
  <div style="max-width:680px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;">
    <span style="font-family:'Raleway',sans-serif;font-size:1.2em;font-weight:600;">Tempest Today</span>
    <button class="toggle-btn" onclick="toggleDark()">
      <div class="toggle-track">
        <span class="t-sun">☀️</span><span class="t-moon">🌙</span>
        <div class="toggle-thumb"></div>
      </div>
    </button>
  </div>
</header>

<div style="max-width:680px;margin:0 auto;padding:0 16px 40px;">

  <!-- ── UV CARD ── -->
  <div class="card">

    <!-- card header -->
    <div style="display:flex;justify-content:space-between;align-items:center;padding:16px 20px 10px;">
      <span class="lbl">UV Index</span>
      <span style="font-size:0.88em;color:var(--muted);"><strong style="color:var(--text);">Fri</strong> 29 May</span>
    </div>

    <!-- chart fills full card width, no side padding -->
    <svg id="chart" viewBox="0 0 700 190" width="100%" style="display:block;">
      <defs>
        <!-- night→day gradient for dawn/dusk bands -->
        <linearGradient id="dawnG" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="var(--night)"/>
          <stop offset="100%" stop-color="var(--night-dim)"/>
        </linearGradient>
        <linearGradient id="duskG" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="var(--night-dim)"/>
          <stop offset="100%" stop-color="var(--night)"/>
        </linearGradient>
        <!-- clip zones — rects positioned by JS -->
        <clipPath id="cpGreen" ><rect id="crGreen"  x="0" width="700"/></clipPath>
        <clipPath id="cpYellow"><rect id="crYellow" x="0" width="700"/></clipPath>
        <clipPath id="cpOrange"><rect id="crOrange" x="0" width="700"/></clipPath>
        <clipPath id="cpRed"   ><rect id="crRed"    x="0" width="700"/></clipPath>
      </defs>

      <!-- ① base: white/card day background -->
      <rect x="0" y="0" width="700" height="165" fill="var(--card)"/>

      <!-- ② night zones (solid) -->
      <rect id="nightL" x="0"   y="0" height="165" fill="var(--night)"/>
      <rect id="nightR"         y="0" height="165" fill="var(--night)"/>

      <!-- ③ dawn / dusk gradient strips -->
      <rect id="dawn" y="0" height="165"/>
      <rect id="dusk" y="0" height="165"/>

      <!-- ④ horizontal grid lines at zone thresholds -->
      <line id="gridLow"    x1="0" x2="700" stroke="var(--border)" stroke-width="0.8" stroke-dasharray="5 4"/>
      <line id="gridMod"    x1="0" x2="700" stroke="var(--border)" stroke-width="0.8" stroke-dasharray="5 4"/>
      <line id="gridHigh"   x1="0" x2="700" stroke="var(--border)" stroke-width="0.8" stroke-dasharray="5 4"/>

      <!-- ⑤ layered zone fills (same area path, different clips + colors) -->
      <path id="fGreen"  class="fzone" fill="rgba(60,180,60,0.28)"  clip-path="url(#cpGreen)"/>
      <path id="fYellow" class="fzone" fill="rgba(255,195,0,0.35)"  clip-path="url(#cpYellow)"/>
      <path id="fOrange" class="fzone" fill="rgba(240,120,0,0.42)"  clip-path="url(#cpOrange)"/>
      <path id="fRed"    class="fzone" fill="rgba(215,50,30,0.42)"  clip-path="url(#cpRed)"/>

      <!-- ⑥ black outline -->
      <path id="hillLine" fill="none" stroke="var(--text)" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round"/>

      <!-- ⑦ "Now" crosshair -->
      <line id="nowLine" stroke="#4a9ff5" stroke-width="1.5"/>
      <circle id="nowDot" r="4.5" fill="none" stroke="#4a9ff5" stroke-width="2"/>

      <!-- ⑧ time labels -->
      <g id="axis" fill="var(--muted)" font-size="11" font-family="-apple-system,sans-serif" text-anchor="middle"/>

      <!-- ⑨ y-axis labels -->
      <g id="yAxis" font-size="10" font-weight="600" font-family="-apple-system,sans-serif"
         text-anchor="start" stroke="var(--card)" stroke-width="3" paint-order="stroke"/>
    </svg>

    <!-- bottom info bar -->
    <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 20px 16px;">
      <div style="display:flex;align-items:baseline;gap:8px;">
        <span style="font-size:3.2em;font-weight:700;line-height:1;color:#f18b00;">6</span>
        <span style="font-size:1em;color:var(--muted);">/ 11</span>
        <div style="margin-left:4px;">
          <div style="font-size:0.9em;font-weight:600;color:#f18b00;">High</div>
          <div style="font-size:0.72em;color:var(--muted);">now &middot; 3 pm</div>
        </div>
      </div>
      <div style="text-align:right;">
        <div class="lbl">Peak today</div>
        <div style="font-size:1.6em;font-weight:700;line-height:1.1;color:#e53210;">9</div>
        <div style="font-size:0.72em;color:var(--muted);">12 – 1 pm</div>
      </div>
    </div>
  </div>

  <!-- ── PROTECTION ── -->
  <div class="card" style="padding:16px 20px;">
    <div class="lbl" style="margin-bottom:12px;">Sun Protection Guide</div>

    <table style="width:100%;border-collapse:collapse;font-size:0.82em;">
      <thead>
        <tr style="color:var(--muted);font-size:0.9em;">
          <th style="text-align:left;padding:0 8px 8px 0;font-weight:500;">Zone</th>
          <th style="text-align:center;padding:0 8px 8px;font-weight:500;">Sunscreen</th>
          <th style="text-align:center;padding:0 8px 8px;font-weight:500;">Hat only?</th>
          <th style="text-align:left;padding:0 0 8px 8px;font-weight:500;">Notes</th>
        </tr>
      </thead>
      <tbody id="adviceTable"></tbody>
    </table>
  </div>

</div>

<script>
  // ── data: 4 am → 9 pm (18 pts) ──
  const DATA = [
    {t:'4am', v:0  }, {t:'5am', v:0  }, {t:'6am', v:0.5}, {t:'7am', v:2  },
    {t:'8am', v:4  }, {t:'9am', v:6  }, {t:'10am',v:7  }, {t:'11am',v:8  },
    {t:'12pm',v:9  }, {t:'1pm', v:9  }, {t:'2pm', v:8  }, {t:'3pm', v:6  },
    {t:'4pm', v:4  }, {t:'5pm', v:2  }, {t:'6pm', v:0.5}, {t:'7pm', v:0  },
    {t:'8pm', v:0  }, {t:'9pm', v:0  },
  ];
  const NOW_IDX = 11; // 3 pm

  const W = 700, H = 165, LABEL_Y = 182;
  const n = DATA.length;
  const xOf = i => (i / (n - 1)) * W;
  const yOf = v => H - (v / 11) * (H - 10);

  const pts = DATA.map((d, i) => ({ x: xOf(i), y: yOf(d.v) }));

  // smooth bezier line
  function buildLine() {
    let d = `M ${pts[0].x.toFixed(1)} ${pts[0].y.toFixed(1)}`;
    for (let i = 1; i < pts.length; i++) {
      const p = pts[i - 1], c = pts[i];
      const cx = ((p.x + c.x) / 2).toFixed(1);
      d += ` C ${cx} ${p.y.toFixed(1)} ${cx} ${c.y.toFixed(1)} ${c.x.toFixed(1)} ${c.y.toFixed(1)}`;
    }
    return d;
  }

  const linePath = buildLine();
  const areaPath = linePath + ` L ${pts[n-1].x} ${H} L ${pts[0].x} ${H} Z`;

  // assign same path to all fill zones
  ['fGreen','fYellow','fOrange','fRed'].forEach(id => {
    document.getElementById(id).setAttribute('d', areaPath);
  });
  document.getElementById('hillLine').setAttribute('d', linePath);

  // zone clip rects
  const y2 = yOf(2), y5 = yOf(5), y7 = yOf(7), y10 = yOf(10);
  function setCR(id, y, h) {
    const r = document.getElementById(id);
    r.setAttribute('y', y.toFixed(1));
    r.setAttribute('height', Math.max(0, h).toFixed(1));
  }
  setCR('crGreen',  y2,  H  - y2);
  setCR('crYellow', y5,  y2 - y5);
  setCR('crOrange', y7,  y5 - y7);
  setCR('crRed',    y10, y7 - y10);

  // grid lines
  function setLine(id, y) {
    const el = document.getElementById(id);
    el.setAttribute('y1', y.toFixed(1));
    el.setAttribute('y2', y.toFixed(1));
  }
  setLine('gridLow',  y2);
  setLine('gridMod',  y5);
  setLine('gridHigh', y7);

  // y-axis labels (left edge, colored per zone, halo via paint-order stroke)
  const yLabels = [
    { v: 0,  label: '0',   color: 'var(--muted)' },
    { v: 2,  label: '2',   color: '#3ea72d' },
    { v: 5,  label: '5',   color: '#c8a000' },
    { v: 7,  label: '7',   color: '#f18b00' },
    { v: 10, label: '10',  color: '#e53210' },
    { v: 11, label: '11+', color: '#b567a4' },
  ];
  const yAxisEl = document.getElementById('yAxis');
  yLabels.forEach(({ v, label, color }) => {
    const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    t.setAttribute('x', '5');
    t.setAttribute('y', yOf(v === 0 ? 0.1 : v).toFixed(1));
    t.setAttribute('dominant-baseline', v === 0 ? 'auto' : 'middle');
    t.setAttribute('fill', color);
    t.textContent = label;
    yAxisEl.appendChild(t);
  });

  // night / dawn / dusk background zones
  // night ends at ~7am (index 3), resumes at ~7pm (index 15)
  const xNightEnd   = xOf(3);   // 7am
  const xDawnEnd    = xOf(5);   // 9am (dawn strip)
  const xDuskStart  = xOf(13);  // 5pm
  const xNightStart = xOf(15);  // 7pm

  const nightL = document.getElementById('nightL');
  nightL.setAttribute('width', xNightEnd.toFixed(1));

  const nightR = document.getElementById('nightR');
  nightR.setAttribute('x',     xNightStart.toFixed(1));
  nightR.setAttribute('width', (W - xNightStart).toFixed(1));

  // dawn gradient strip
  const dawn = document.getElementById('dawn');
  dawn.setAttribute('x',     xNightEnd.toFixed(1));
  dawn.setAttribute('width', (xDawnEnd - xNightEnd).toFixed(1));
  // set gradient coords to match strip
  document.getElementById('dawnG').setAttribute('x1', xNightEnd);
  document.getElementById('dawnG').setAttribute('x2', xDawnEnd);
  dawn.setAttribute('fill', 'url(#dawnG)');

  const dusk = document.getElementById('dusk');
  dusk.setAttribute('x',     xDuskStart.toFixed(1));
  dusk.setAttribute('width', (xNightStart - xDuskStart).toFixed(1));
  document.getElementById('duskG').setAttribute('x1', xDuskStart);
  document.getElementById('duskG').setAttribute('x2', xNightStart);
  dusk.setAttribute('fill', 'url(#duskG)');

  // "Now" crosshair
  const nx = xOf(NOW_IDX), ny = yOf(DATA[NOW_IDX].v);
  const nowLine = document.getElementById('nowLine');
  nowLine.setAttribute('x1', nx.toFixed(1)); nowLine.setAttribute('y1', '0');
  nowLine.setAttribute('x2', nx.toFixed(1)); nowLine.setAttribute('y2', H);
  const nowDot = document.getElementById('nowDot');
  nowDot.setAttribute('cx', nx.toFixed(1));
  nowDot.setAttribute('cy', ny.toFixed(1));

  // time axis labels (every 2 hrs = every other point)
  const axis = document.getElementById('axis');
  DATA.forEach((d, i) => {
    if (i % 2 !== 0) return;
    const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    t.setAttribute('x', xOf(i).toFixed(1));
    t.setAttribute('y', LABEL_Y);
    t.textContent = d.t;
    axis.appendChild(t);
  });

  // ── protection table ──
  const ADVICE = [
    {
      range: '0 – 2', label: 'Low', color: '#3ea72d',
      spf: 'None needed',
      hatOnly: '✅ Yes',
      note: 'No real risk. Sunglasses on bright days is plenty.',
    },
    {
      range: '3 – 5', label: 'Moderate', color: '#c8a000',
      spf: 'SPF 15+',
      hatOnly: '⚠️ Short trips',
      note: 'Hat alone is fine for a quick errand (&lt;20 min). Add SPF 15+ if you\'ll be out longer.',
    },
    {
      range: '6 – 7', label: 'High', color: '#f18b00',
      spf: 'SPF 30+',
      hatOnly: '❌ No',
      note: 'Sunscreen is essential. Apply 15 min before going out, reapply every 2 hrs. Seek shade 10am–4pm.',
    },
    {
      range: '8 – 10', label: 'Very High', color: '#e53210',
      spf: 'SPF 50+',
      hatOnly: '❌ No',
      note: 'Cover exposed skin. Shirt + hat + SPF 50+. Minimize time outside 10am–4pm.',
    },
    {
      range: '11+', label: 'Extreme', color: '#b567a4',
      spf: 'SPF 50+ every hr',
      hatOnly: '❌ No',
      note: 'Stay indoors if possible. Full cover required — hat, long sleeves, SPF 50+.',
    },
  ];

  const NOW_UV = DATA[NOW_IDX].v;
  const tbody = document.getElementById('adviceTable');
  ADVICE.forEach(row => {
    const isNow = (NOW_UV >= 6 && row.label === 'High')
               || (NOW_UV <= 2 && row.label === 'Low')
               || (NOW_UV >= 3 && NOW_UV <= 5 && row.label === 'Moderate')
               || (NOW_UV >= 8 && NOW_UV <= 10 && row.label === 'Very High')
               || (NOW_UV >= 11 && row.label === 'Extreme');

    const bg = isNow ? `${row.color}18` : 'transparent';
    const border = isNow ? `2px solid ${row.color}55` : '1px solid transparent';

    tbody.innerHTML += `
      <tr style="background:${bg};border-radius:8px;">
        <td style="padding:7px 8px 7px 0;border-top:1px solid var(--border);">
          <span style="display:inline-flex;align-items:center;gap:6px;">
            <span style="width:10px;height:10px;border-radius:50%;background:${row.color};flex-shrink:0;display:inline-block;"></span>
            <span style="font-weight:${isNow ? '700' : '400'};color:${isNow ? row.color : 'var(--text)'};">${row.range}</span>
          </span>
        </td>
        <td style="text-align:center;padding:7px 8px;border-top:1px solid var(--border);color:var(--text);">${row.spf}</td>
        <td style="text-align:center;padding:7px 8px;border-top:1px solid var(--border);">${row.hatOnly}</td>
        <td style="padding:7px 0 7px 8px;border-top:1px solid var(--border);color:var(--muted);line-height:1.4;">${row.note}${isNow ? ' <strong style="color:' + row.color + '">← now</strong>' : ''}</td>
      </tr>`;
  });

  // ── animate on load ──
  document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'light');

  window.addEventListener('DOMContentLoaded', () => {
    const line = document.getElementById('hillLine');
    const len  = line.getTotalLength();
    line.style.strokeDasharray  = len;
    line.style.strokeDashoffset = len;
    setTimeout(() => {
      line.style.strokeDashoffset = '0';
      document.querySelectorAll('.fzone').forEach(el => el.style.opacity = '1');
    }, 80);
  });

  function toggleDark() {
    const html = document.documentElement;
    const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
  }
</script>
</body>
</html>
